# Preview of the site on GitHub Pages: https://reysostyle.github.io/reyso-next/
# Built as static files, so the old .html redirects don't run there and
# the store stays in demo mode (orders and accounts live in the browser).
name: Pages preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PAGES_BASE_PATH: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # No database or server on Pages: drop the admin panel and the redirect proxy.
      - run: rm -rf "src/app/(payload)" "src/app/(store-api)" src/proxy.ts
      - run: npm run build
      - run: node scripts/prefix-assets.mjs out
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
